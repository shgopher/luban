# 反例：把 404 兜底到 index.html（"SPA 都这么配"）。缺失的 chunk 会拿到 200 + text/html。
worker_processes 1;
pid logs/nginx-spa.pid;
error_log logs/error-spa.log warn;
events { worker_connections 64; }
http {
  access_log logs/access-spa.log;
  include /tmp/t73nginx/conf/mime.types;
  default_type application/octet-stream;
  server {
    listen 18702;
    root /Users/shgopher/Desktop/family/luban/.cache/t73/s735/www;
    location / { try_files $uri /index.html; }
  }
}
