# 正例：三类对象分开设缓存。伪静态 rewrite 模块未编进来，因此用 location 精确匹配 + try_files =404。
# 校验：nginx -t -c 本文件；运行：nginx -p <prefix> -c <本文件>；nginx -s stop
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 64; }
http {
  access_log logs/access.log;
  include /tmp/t73nginx/conf/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # 404 的「负缓存」也要管：缺失资源若带 immutable，CDN/浏览器会把 404 缓存一年
  map $status $assets_cc {
    200 "public, max-age=31536000, immutable";
    default "no-store";
  }
  server {
    listen 18701;
    server_name _;
    root /Users/shgopher/Desktop/family/luban/.cache/t73/s735/www;

    # 1) 入口 HTML：每次都回源验证，绝不长期缓存
    location = /index.html {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }
    location = / {
      add_header Cache-Control "no-store" always;
      try_files /index.html =404;
    }
    # 2) 带内容哈希的资源：不可变，长缓存；缺失必须 404，不能回落到 index.html
    location /assets/ {
      add_header Cache-Control $assets_cc always;
      try_files $uri =404;
    }
    # 3) Service Worker 脚本：可以缓存，但必须每次回源验证（它自己控制缓存）
    location = /sw.js {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }
  }
}
