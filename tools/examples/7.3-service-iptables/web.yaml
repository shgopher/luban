apiVersion: v1
kind: Namespace
metadata:
  name: svc-verify
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svc-verify
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: svc-verify
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-np
  namespace: svc-verify
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
