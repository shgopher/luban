apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: canary-demo, track: stable}
  template:
    metadata:
      labels: {app: canary-demo, track: stable}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo \"stable-v1 pod=$HOSTNAME\" > /www/index.html && exec httpd -f -p 8080 -h /www"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: canary-demo, track: canary}
  template:
    metadata:
      labels: {app: canary-demo, track: canary}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo \"canary-v2 pod=$HOSTNAME\" > /www/index.html && exec httpd -f -p 8080 -h /www"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo
  namespace: lab
spec:
  type: NodePort
  selector:
    app: canary-demo
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
