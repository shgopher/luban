apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burn
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-burn}
  template:
    metadata:
      labels: {app: cpu-burn}
    spec:
      containers:
      - name: burner
        image: busybox:1.36
        command: ["sh", "-c", "while true; do :; done"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
