apiVersion: v1
kind: Pod
metadata:
  name: cm-demo
  namespace: lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    volumeMounts:
    - name: cfg
      mountPath: /etc/app
    - name: cfg
      mountPath: /etc/sub/app.conf
      subPath: app.conf
  volumes:
  - name: cfg
    configMap:
      name: app-config
